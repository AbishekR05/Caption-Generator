<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-app-region: no-drag;  /* IMPORTANT: entire body is no-drag */
    }

    #drag-handle {
      /* Do NOT use -webkit-app-region: drag — use JS mouse tracking instead */
      height: 20px;
      width: 100%;
      cursor: grab;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;  /* hidden by default */
      transition: opacity 0.2s;
    }

    #drag-handle:hover {
      opacity: 1;  /* appears on hover */
    }

    #drag-handle span {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 3px;
      user-select: none;
    }

    #caption-container {
      padding: 8px 24px 12px;
      text-align: center;
    }

    /* Background box — controlled by user settings */
    #caption-box {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.0);  /* default: no background */
      transition: background 0.2s;
    }

    #transcript {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 22px;           /* default — user can change */
      font-weight: 600;
      color: #ffffff;            /* default — user can change */
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0px  2px 4px rgba(0,0,0,0.8);
      line-height: 1.4;
      min-height: 30px;
    }

    #translated {
      font-family: 'Noto Sans Tamil', 'Segoe UI', sans-serif;
      font-size: 16px;
      color: #a5f3fc;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
      margin-top: 2px;
      display: none;
    }

    #placeholder {
      font-size: 14px;
      color: rgba(255,255,255,0.2);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="drag-handle">
    <span>⠿ SUBTITLES — Ctrl+Shift+C to hide</span>
  </div>
  <div id="caption-container">
    <div id="caption-box">
      <div id="placeholder">Waiting for subtitles...</div>
      <div id="transcript"></div>
      <div id="translated"></div>
    </div>
  </div>

  <script>
    const transcriptEl = document.getElementById('transcript')
    const translatedEl = document.getElementById('translated')
    const placeholderEl = document.getElementById('placeholder')
    const dragHandle = document.getElementById('drag-handle')
    const captionBox = document.getElementById('caption-box')

    const currentSettings = {
        fontSize: 22,
        textColor: '#ffffff',
        bgOpacity: 0,
        bgColor: '#000000'
    }

    window.electronAPI.onCaption((data) => {
      placeholderEl.style.display = 'none'

      transcriptEl.textContent = data.transcript || ''
      
      if (data.translated) {
        translatedEl.textContent = data.translated
        translatedEl.style.display = 'block'
      } else {
        translatedEl.textContent = ''
        translatedEl.style.display = 'none'
      }
    })

    window.electronAPI.onSettings((settings) => {
      if (settings.fontSize) {
        transcriptEl.style.fontSize = settings.fontSize + 'px'
      }
      if (settings.textColor) {
        transcriptEl.style.color = settings.textColor
      }
      if (settings.bgOpacity !== undefined || settings.bgColor) {
        const opacity = settings.bgOpacity ?? currentSettings.bgOpacity
        const color = settings.bgColor ?? currentSettings.bgColor
        const r = parseInt(color.slice(1,3), 16)
        const g = parseInt(color.slice(3,5), 16)
        const b = parseInt(color.slice(5,7), 16)
        captionBox.style.background = `rgba(${r},${g},${b},${opacity / 100})`
      }
      Object.assign(currentSettings, settings)
    })

    let isDragging = false
    let dragStartX, dragStartY
    
    dragHandle.addEventListener('mousedown', (e) => {
      isDragging = true
      dragStartX = e.screenX
      dragStartY = e.screenY
      window.electronAPI.startDrag()  // disable click-through
    })
    
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return
      const dx = e.screenX - dragStartX
      const dy = e.screenY - dragStartY
      window.electronAPI.moveOverlay(dx, dy)  // tell main process to move window
      dragStartX = e.screenX
      dragStartY = e.screenY
    })
    
    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false
        window.electronAPI.endDrag()  // re-enable click-through
      }
    })
  </script>
</body>
</html>
